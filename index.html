<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPPG Salawu - Checklist</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{max-width:480px;margin:0 auto;background:#f1f5f9;font-family:system-ui,sans-serif;padding:12px}
.header{background:#1e293b;color:#fff;padding:16px;border-radius:12px;margin-bottom:12px}
.tab{padding:8px 16px;border-radius:20px;border:1px solid #ddd;display:inline-block;margin-right:6px;cursor:pointer}
.tab.active{background:#1e293b;color:#fff}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #e2e8f0;display:flex;gap:10px}
.card.done{background:#dcfce7;border-color:#86efac}
.card.done b{text-decoration:line-through}
.check{width:26px;height:26px;border-radius:50%;border:2px solid #94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.card.done .check{background:#16a34a;border-color:#16a34a;color:#fff}
.progress{height:8px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:#22c55e;width:0%;transition:.3s}
</style>
</head>
<body>
<div class="header">
<h3>SPPG Karang Mukti 2</h3>
<p id="status">Klik lingkaran = auto kesimpen ke Sheet</p>
<div class="progress"><div id="fill" class="fill"></div></div>
</div>
<div id="list">Memuat...</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyU8eQA6nTCoTpp2UOvD-LEDaNpqaXX5TI8dMhht-g6AelRStD6GlGSe8EJudCHrNaZ/exec";
let data=[];
async function load(){
  const r = await fetch(SCRIPT_URL);
  data = await r.json();
  render();
}
function render(){
  const wrap=document.getElementById('list');
  let doneCount=data.filter(d=>(d.selesai||'').toLowerCase()=='x').length;
  document.getElementById('fill').style.width = data.length? (doneCount/data.length*100)+'%' : '0%';
  let html='';
  data.forEach(it=>{
    const done=(it.selesai||'').toLowerCase()=='x';
    html+=`<div class="card ${done?'done':''}">
      <div class="check" onclick="toggle(${it.row})">${done?'✓':''}</div>
      <div style="flex:1">
        <b>${it.menu}</b><br>
        <small>${it.hari} - ${it.bahan||''}</small><br>
        <small>📝 ${it.sop||''}</small><br>
        ${it.link?`<a href="${it.link}" target="_blank">▶️ Video</a>`:''}
      </div>
    </div>`;
  });
  wrap.innerHTML=html;
}
async function toggle(row){
  const it=data.find(x=>x.row==row);
  const newVal=(it.selesai||'').toLowerCase()=='x'?'':'x';
  it.selesai=newVal;
  render();
  document.getElementById('status').textContent='Menyimpan ke Sheet...';
  await fetch(`${SCRIPT_URL}?action=update&row=${row}&val=${newVal}`,{mode:'no-cors'});
  document.getElementById('status').textContent='✅ Tersimpan di kolom F!';
  setTimeout(()=>document.getElementById('status').textContent='Klik lingkaran = auto kesimpen ke Sheet',2000);
}
load();
</script>
</body>
</html>
