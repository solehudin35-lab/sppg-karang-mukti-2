<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPPG Karang Mukti 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f1f5f9;font-family:system-ui,sans-serif;max-width:500px;margin:0 auto}
.header{background:#1e293b;color:#fff;padding:16px 14px;border-radius:0 0 16px 16px;position:relative}
.header.top{display:flex;justify-content:space-between;align-items:flex-start}
.header h4{color:#facc15;font-size:12px;letter-spacing:.5px}
.header h1{font-size:22px;line-height:1.2;margin:6px 0;font-weight:800}
.header.sub{font-size:13px;margin-top:6px}
.avatar{width:64px;height:64px;border-radius:50%;border:4px solid #facc15;object-fit:cover;background:#fff;flex-shrink:0}
.progress{height:10px;background:#e2e8f0;border-radius:20px;margin-top:14px;overflow:hidden}
.fill{height:100%;background:#22c55e;width:0%;transition:.4s}
.status{font-size:12px;color:#86efac;margin-top:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 18px;border-radius:24px;background:#fff;border:1.5px solid #e2e8f0;font-weight:700;white-space:nowrap;cursor:pointer;font-size:14px}
.tab.active{background:#1e293b;color:#fff;border-color:#1e293b}
.info-bar{padding:0 14px 8px;font-size:12px;color:#64748b}
.list{padding:8px 12px 30px}
.card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0;margin-bottom:12px}
.card.done{opacity:.6;background:#f0fdf4}
.card-head{display:flex;gap:12px;align-items:center;justify-content:space-between}
.check{width:34px;height:34px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900;flex-shrink:0}
.card.done.check{background:#16a34a;border-color:#16a34a;color:#fff}
.title{font-weight:800;font-size:16px;flex:1}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700}
.sop{background:#f0fdf4;color:#166534}
.video{background:#fef2f2;color:#991b1b}
.bahan-box{background:#fdf6ee;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.6;color:#334155}
</style>
</head>
<body>
<div class="header">
<div class="top">
<div>
<h4>SPPG KARANG MUKTI 2 - SALAWU TASIK</h4>
<h1>Tugas Tim Persiapan dan pengolahan</h1>
<div class="sub">👨‍🍳 Chef Soleh - ✅ <span id="live">Live 0 tugas</span></div>
</div>
<img class="avatar" src="chef.jpg" onerror="this.src='https://i.pravatar.cc/100?img=12'">
</div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div class="status" id="status">0/0 selesai (0%)</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="info-bar" id="infobar">Memuat...</div>
<div class="list" id="list"></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyU8eQA6nTCoTpp2UOvD-LEDaNpqaXX5TI8dMhht-g6AelRStD6GlGSe8EJudCHrNaZ/exec";
let data=[],active='Senin';
async function load(){
 const r=await fetch(SCRIPT_URL);
 data=await r.json();
 renderTabs(); render();
}
function renderTabs(){
 let days=[...new Set(data.map(d=>(d.hari||'').trim()).filter(Boolean))];
 if(!days.includes(active)) active=days[0]||'Senin';
 document.getElementById('tabs').innerHTML=days.map(d=>`<div class="tab ${d===active?'active':''}" onclick="active='${d}';renderTabs();render()">${d}</div>`).join('');
}
function render(){
 let filtered=data.filter(d=>(d.hari||'').trim()===active);
 let doneTotal=data.filter(d=>(d.selesai||'').toLowerCase().trim()==='x').length;
 let pct=data.length?Math.round(doneTotal/data.length*100):0;
 document.getElementById('fill').style.width=pct+'%';
 document.getElementById('status').textContent=`${doneTotal}/${data.length} selesai (${pct}%)`;
 document.getElementById('live').textContent=`Live ${data.length} tugas`;
 document.getElementById('infobar').innerHTML=`${active} - ${filtered.length} tugas | Ketik <b>x</b> di kolom F Sheet = auto hijau di semua HP ✅`;
 let html='';
 filtered.forEach(it=>{
  let done=(it.selesai||'').toLowerCase().trim()==='x';
  let bahanRaw=(it.bahan||'').split('||').join('\n');
  let bahanLines=bahanRaw.split('\n').filter(Boolean).map(b=>`• ${b.trim()}`).join('<br>');
  html+=`<div class="card ${done?'done':''}">
   <div class="card-head">
    <div style="display:flex;gap:12px;align-items:center;flex:1">
     <div class="check" onclick="toggle(${it.row})">${done?'✓':''}</div>
     <div class="title">${it.menu||'-'}</div>
    </div>
    <div class="badges">
     ${it.link?`<a class="badge video" href="${it.link}" target="_blank">🎥 Video</a>`:''}
     <span class="badge sop">📄 SOP</span>
    </div>
   </div>
   <div class="bahan-box">
    ${bahanLines||'-'}<br><br>📌 <b>SOP:</b> ${it.sop||'Beras premium Salawu'}
   </div>
  </div>`;
 });
 document.getElementById('list').innerHTML=html||'Tidak ada tugas';
}
async function toggle(row){
 let it=data.find(x=>x.row==row);
 let newVal=(it.selesai||'').toLowerCase().trim()==='x'?'':'x';
 it.selesai=newVal; render();
 document.getElementById('status').textContent='Menyimpan ke Sheet...';
 await fetch(`${SCRIPT_URL}?action=update&row=${row}&val=${encodeURIComponent(newVal)}`,{mode:'no-cors'});
 document.getElementById('status').textContent='✅ Tersimpan di kolom F Sheet!';
 setTimeout(render,1200);
}
load();
</script>
</body>
</html>
