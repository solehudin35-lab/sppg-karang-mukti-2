<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPPG Karang Mukti 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f1f5f9;font-family:system-ui;max-width:500px;margin:0 auto}
.header{background:#1e293b;color:#fff;padding:16px;border-radius:0 0 16px 16px}
.top{display:flex;justify-content:space-between}
.header h4{color:#facc15;font-size:11px}
.header h1{font-size:22px;margin:6px 0}
.sub{font-size:13px}
.avatar{width:64px;height:64px;border-radius:50%;border:4px solid #facc15}
.progress{height:10px;background:#334155;border-radius:20px;margin-top:14px;overflow:hidden}
.fill{height:100%;background:#22c55e;width:0%}
.status{font-size:12px;color:#86efac;margin-top:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px}
.tab{padding:10px 18px;border-radius:24px;background:#fff;border:1.5px solid #e2e8f0;font-weight:700;cursor:pointer}
.tab.active{background:#1e293b;color:#fff}
.list{padding:8px 12px 30px}
.card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0;margin-bottom:12px}
.card.done{opacity:.6;background:#f0fdf4}
.head{display:flex;gap:12px;align-items:center;justify-content:space-between}
.check{width:34px;height:34px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900}
.card.done.check{background:#16a34a;border-color:#16a34a;color:#fff}
.title{font-weight:800;flex:1}
.badge{padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;text-decoration:none}
.sop-active{background:#2563eb!important;color:#fff!important}
.sop-off{background:#f1f5f9;color:#94a3b8}
.video{background:#fef2f2;color:#991b1b}
.box{background:#fffbeb;border-radius:12px;padding:12px;margin-top:12px;font-size:13px}
</style>
</head>
<body>
<div class="header">
<div class="top"><div><h4>SPPG KARANG MUKTI 2</h4><h1>Tugas Tim Persiapan dan pengolahan</h1><div class="sub">👨‍🍳 Chef Soleh - ✅ <span id="live"></span></div></div><img class="avatar" src="chef.jpg"></div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div class="status" id="status"></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyOZuEsYnZa3-jcePLS_BqmacEV85JySOiszZ5s0Qcuj4FMZLP68LPEf4bjzSYtF7Gq/exec";
let data=[],active='Senin';
async function load(){let r=await fetch(SCRIPT_URL);data=await r.json();renderTabs();render();}
function renderTabs(){let days=[...new Set(data.map(d=>d.hari.trim()).filter(Boolean))];if(!days.includes(active))active=days[0];document.getElementById('tabs').innerHTML=days.map(d=>`<div class="tab ${d===active?'active':''}" onclick="active='${d}';renderTabs();render()">${d}</div>`).join('');}
function render(){let filtered=data.filter(d=>d.hari.trim()===active);let done=data.filter(d=>d.selesai.toLowerCase().trim()==='x').length;let pct=data.length?Math.round(done/data.length*100):0;document.getElementById('fill').style.width=pct+'%';document.getElementById('status').textContent=`${done}/${data.length} selesai (${pct}%)`;document.getElementById('live').textContent=`Live ${data.length} tugas`;let h='';filtered.forEach(it=>{let done=(it.selesai||'').toLowerCase().trim()==='x';let bahan=(it.bahan||'').split('||').join('<br>• ');let sopLink=(it.link_sop||'').trim();let sopBtn=sopLink?`<a class="badge sop-active" href="${sopLink}" target="_blank">📄 SOP</a>`:`<span class="badge sop-off">📄 SOP</span>`;h+=`<div class="card ${done?'done':''}"><div class="head"><div style="display:flex;gap:12px;align-items:center;flex:1"><div class="check" onclick="toggle(${it.row})">${done?'✓':''}</div><div class="title">${it.menu}</div></div><div style="display:flex;gap:6px">${it.link?`<a class="badge video" href="${it.link}" target="_blank">🎥 Video</a>`:''}${sopBtn}</div></div><div class="box">• ${bahan}<br><br>📌 <b>SOP:</b> ${it.sop||''}</div></div>`;});document.getElementById('list').innerHTML=h;}
async function toggle(row){let it=data.find(x=>x.row==row);let newVal=it.selesai.toLowerCase().trim()==='x'?'':'x';it.selesai=newVal;render();await fetch(`${SCRIPT_URL}?action=update&row=${row}&val=${newVal}`,{mode:'no-cors'});setTimeout(load,1200);}
load();
</script>
</body>
</html>
