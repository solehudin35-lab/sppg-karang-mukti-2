<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPPG karang mukti 2 </title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0fdf4;font-family:system-ui;max-width:500px;margin:0 auto}
.header{background:linear-gradient(135deg,#14532d,#16a34a);color:#fff;padding:20px 16px 14px;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.tab{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid #d1fae5;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.active{background:#16a34a;color:#fff}
.list{padding:0 12px 20px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.done{opacity:.6;background:#f0fdf4}
.check{width:30px;height:30px;border-radius:50%;border:2px solid #86efac;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card.done .check{background:#16a34a;color:#fff}
</style>
</head>
<body>
<div class="header">
<h1>🥗 SPPG Karang Mukti 2</h1>
<p id="status">Memuat...</p>
<div style="height:8px;background:rgba(255,255,255,.25);border-radius:10px;margin-top:10px"><div id="fill" style="height:100%;background:#bbf7d0;width:0%"></div></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyU8eQA6nTCoTpp2UOvD-LEDaNpqaXX5TI8dMhht-g6AelRStD6GlGSe8EJudCHrNaZ/exec";
let data=[],activeDay='Semua';
async function load(){const r=await fetch(SCRIPT_URL);data=await r.json();renderTabs();render();}
function renderTabs(){const days=['Semua',...new Set(data.map(d=>d.hari.trim()).filter(Boolean))];document.getElementById('tabs').innerHTML=days.map(d=>`<div class="tab ${d===activeDay?'active':''}" onclick="setDay('${d}')">${d}</div>`).join('')}
function setDay(d){activeDay=d;renderTabs();render()}
function render(){let f=activeDay==='Semua'?data:data.filter(d=>d.hari.trim()===activeDay);let done=data.filter(d=>(d.selesai||'').toLowerCase()=='x').length;document.getElementById('fill').style.width=(done/data.length*100)+'%';document.getElementById('status').textContent=`${done}/${data.length} selesai`;document.getElementById('list').innerHTML=f.map(it=>{const done=(it.selesai||'').toLowerCase()=='x';return `<div class="card ${done?'done':''}"><div class="check" onclick="toggle(${it.row})">${done?'✓':''}</div><div><b>${it.menu}</b><br><small>${it.hari} - ${it.bahan||''}</small><br>${it.link?`<a href="${it.link}" target=_blank>▶️ Video</a>`:''}</div></div>`}).join('')}
async function toggle(row){const it=data.find(x=>x.row==row);it.selesai=it.selesai.toLowerCase()=='x'?'':'x';render();await fetch(`${SCRIPT_URL}?action=update&row=${row}&val=${it.selesai}`,{mode:'no-cors'})}
load();
</script>
</body>
</html>
